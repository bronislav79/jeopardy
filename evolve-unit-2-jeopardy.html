<style>
/* Layout: classic 5x5 Jeopardy board, score bar below, question opens as a full-screen card. */
:root {
  --bg: #141a55;
  --tile: #2e3894;
  --tile-hover: #3b47b5;
  --line: #070a24;
  --gold: #f6c445;
  --ink: #ffffff;
  --muted: #b3bbf2;
  --good: #46d37c;
  --bad: #ff7070;
  --panel: #1d2570;
  --font-display: 'Oswald', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Source Sans 3', 'Segoe UI', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
h1 {
  font-family: var(--font-display); font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  font-size: clamp(1.6rem, 4vw, 2.6rem); margin: 0; text-wrap: balance;
}
h1 span { color: var(--gold); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; color: var(--muted); font-size: .95rem; }
.tools label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn {
  background: var(--panel); border: 2px solid var(--muted); border-radius: 6px; padding: 7px 14px;
  font-weight: 600; color: var(--ink);
}
.btn:hover { background: var(--tile-hover); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.board {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px;
  background: var(--line); border: 4px solid var(--line);
}
.cat {
  background: var(--tile); min-height: clamp(64px, 11vw, 110px); display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 6px; font-family: var(--font-display); font-weight: 500; text-transform: uppercase;
  letter-spacing: .03em; font-size: clamp(.78rem, 2.1vw, 1.7rem); line-height: 1.1; text-wrap: balance; overflow-wrap: anywhere;
}
.tile {
  background: var(--tile); border: 0; border-radius: 0; min-height: clamp(54px, 9.5vw, 96px);
  font-family: var(--font-display); font-weight: 700; color: var(--gold); font-size: clamp(1.1rem, 3.6vw, 3rem);
  text-shadow: 2px 2px 0 var(--line); transition: background .15s;
}
.tile:hover { background: var(--tile-hover); }
.tile.done { background: var(--tile); color: transparent; text-shadow: none; cursor: default; opacity: .55; }
.tile.done:hover { background: var(--tile); }

.scores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.team { background: var(--panel); border: 2px solid var(--line); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.team input[type=text] {
  width: 100%; background: transparent; color: var(--ink); border: 0; border-bottom: 2px solid var(--muted);
  font-family: var(--font-display); font-weight: 500; letter-spacing: .05em; text-transform: uppercase; font-size: 1.15rem; padding: 2px 0;
}
.team .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.score { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 6vw, 3.4rem); font-variant-numeric: tabular-nums; line-height: 1; }
.score.neg { color: var(--bad); }
.adj { display: flex; gap: 6px; }
.adj button { background: var(--tile); border: 2px solid var(--line); border-radius: 6px; padding: 4px 10px; font-weight: 700; }
.adj button:hover { background: var(--tile-hover); }
.hint { color: var(--muted); font-size: .9rem; margin: 0; }

/* Question card */
.modal {
  position: fixed; inset: 0; z-index: 10; background: var(--tile); overflow-y: auto;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card { max-width: 980px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px;
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; }
.meta .c { font-size: clamp(1rem, 2.4vw, 1.5rem); color: var(--muted); }
.meta .p { font-size: clamp(1.4rem, 3.4vw, 2.2rem); color: var(--gold); font-weight: 700; }
.dd {
  align-self: flex-start; background: var(--gold); color: var(--line); font-family: var(--font-display); font-weight: 700;
  letter-spacing: .08em; padding: 4px 14px; text-transform: uppercase; font-size: 1.15rem;
}
.question {
  flex: 1 0 auto; display: flex; align-items: center; justify-content: center; text-align: center; white-space: pre-line;
  font-family: var(--font-body); font-weight: 600; font-size: clamp(1.35rem, 3.1vw, 2.5rem); line-height: 1.35; text-wrap: balance;
  padding: 10px 0;
}
.answer {
  background: var(--line); border-left: 6px solid var(--gold); padding: 14px 18px; font-size: clamp(1.15rem, 2.4vw, 1.8rem);
  font-weight: 600; white-space: pre-line;
}
.answer small { display: block; font-family: var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); font-size: .8rem; margin-bottom: 4px; }
.timerbar { height: 8px; background: var(--line); }
.timerbar i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions .grp { display: flex; gap: 8px; flex: 1 1 260px; min-width: 0; }
.actions .grp .btn { flex: 1 1 0; min-width: 0; overflow-wrap: anywhere; }
.btn.ok { border-color: var(--good); }
.btn.no { border-color: var(--bad); }
.btn.gold { background: var(--gold); color: var(--line); border-color: var(--gold); }
.btn.gold:hover { background: #ffd566; }
.spacer { flex: 1 1 auto; }

@media (max-width: 560px) {
  .scores { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h1>Evolve <span>Unit 2</span></h1>
    <div class="tools">
      <label for="penalty"><input type="checkbox" id="penalty" checked> Subtract points for wrong answers</label>
      <button class="btn" id="reset" type="button">New game</button>
    </div>
  </div>

  <div class="board" id="board" aria-label="Jeopardy board"></div>

  <div class="scores" id="scores"></div>
  <p class="hint">Click a tile to open the question. A wrong answer keeps the card open so the other team can steal. One tile hides a Daily Double (points x2).</p>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mcat" hidden>
  <div class="card">
    <div class="meta"><span class="c" id="mcat"></span><span class="p" id="mpts"></span></div>
    <div class="dd" id="mdd" hidden>Daily Double &middot; points x2</div>
    <div class="question" id="mq"></div>
    <div class="answer" id="ma" hidden><small>Answer</small><span id="mat"></span></div>
    <div class="timerbar" id="tbar" hidden><i id="tfill"></i></div>
    <div class="actions">
      <button class="btn gold" id="show" type="button">Show answer</button>
      <button class="btn" id="timer" type="button">Timer 30 s</button>
      <span class="spacer"></span>
      <button class="btn" id="back" type="button">Back to board</button>
      <button class="btn" id="nobody" type="button">Nobody got it</button>
    </div>
    <div class="actions" id="award"></div>
  </div>
</div>

    [`Complete with a three-word phrasal verb:\n“I can't ______ ______ ______ this noise any longer.”\n(= tolerate)`, `put up with`],
    [`She was brought up to ______ ______ ______ the weak and never let anyone be bullied.\n(= defend, support)`, `stand up for`],
    [`When the business failed, he had no savings to ______ ______ ______.\n(= use as a backup in an emergency)`, `fall back on`],
    [`Our start-up ______ ______ ______ serious legal barriers when we expanded abroad.\n(= met a problem unexpectedly)`, `ran up against`],
    [`Find and fix TWO mistakes:\n“He kept messing around the project instead of facing up the problem.”`, `messing around WITH the project\nfacing up TO the problem`]
  ]},
  { name: 'Vocabulary: character / appearance', items: [
    [`Which adjective describes a person who believes everything they are told and is easy to trick?`, `gullible`],
    [`Which word describes hair that is messy and untidy, for example after a storm or a long night?`, `dishevelled`],
    [`Two expressions meaning “looks exactly like someone”:\n“She ______ a ______ resemblance to her mother.”\n“She's the ______ ______ of her mother.”`, `bears a striking resemblance\nthe spitting image`],
    [`Sensitive or sensible?\nA) He cried at the advert. He's very ______.\nB) She never makes reckless choices. She's very ______.`, `A) sensitive\nB) sensible`],
    [`Explain the difference between self-deprecating and self-congratulatory. Then name two more adjectives for someone who thinks only about themselves.`, `Self-deprecating: jokes about or plays down your own flaws.\nSelf-congratulatory: pleased with yourself, boasting about your achievements.\nMore: self-centred, self-absorbed, egotistical.`]
  ]},
  { name: 'Different vocabulary', items: [
    [`Fidget spinners were just a ______. Everybody had one for a month and then they disappeared.\n(= a short-lived craze)`, `fad (or craze)`],
    [`Complete the idiom and explain it:\n“Those two are as thick as ______.”`, `thieves: very close friends who share everything`],
    [`What does the idiom “the die is cast” mean?`, `The decision has been made and cannot be changed. There is no going back.`],
    [`Choose the correct verb:\nA) Her anxiety (stems from / exudes) a difficult childhood.\nB) The new manager (stems from / exudes) confidence.`, `A) stems from\nB) exudes`],
    [`Make ONE sentence using “to jump on the bandwagon” and “a lucrative market niche”.`, `Sample: Hundreds of start-ups jumped on the bandwagon as soon as someone found a lucrative market niche in eco-friendly packaging.\n(Accept any correct, meaningful sentence.)`]
  ]},
  { name: 'Grammar: will / would / used to', items: [
    [`Choose the correct option and say why:\n“When I was a child, we would live / used to live in a tiny village.”`, `used to live\n“Live” is a state, and would only describes repeated past actions.`],
    [`Typical behaviour. Complete with will + verb:\n“Ask Alan, he ______ (never / say) no. He always helps.”`, `will never say`],
    [`Make this opinion sound polite and tentative with WOULD:\n“This plan is too ambitious.”`, `For example: “I would say this plan is a little too ambitious.”\n(Also: I would suggest / I would argue ...)`],

  ]},
  { name: '67', items: [
    [`Odd one out:\nslender · portly · chubby · immaculate`, `immaculate\nThe others describe body shape.`],
    [`Who am I?\n“I run three online shops, sell vintage jackets at weekends and always look for extra cash.”`, `a hustler (someone with a side hustle)`],
    [`Odd one out (meaning):\nhinder · hamper · hoard · obstruct`, `hoard\nThe others mean to get in the way of something.`],
    [`Two US school stereotypes:\nA) sporty, popular, not seen as academic\nB) from a private school, neat and expensive clothes`, `A) a jock\nB) a prep`],
    [`Переведите на английский, используя три выражения из списка:\n«Они были неразлучны, пока не поссорились, и всё свелось к деньгам.»`, `They were as thick as thieves until they fell out, and it all boiled down to money.`]
  ]}

const VALUES = [100, 200, 300, 400, 500];
const TEAMS = 2;
const TIME = 30;

const $ = (id) => document.getElementById(id);
let st;

function freshState() {
  const c = Math.floor(Math.random() * DATA.length);
  const r = 1 + Math.floor(Math.random() * 4);
  return {
    scores: [0, 0], used: {}, dd: c + '-' + r, cur: null,
    tried: [false, false], timerId: null
  };
}

function names() {
  return [0, 1].map((i) => {
    const el = $('tn' + i);
    return (el && el.value.trim()) || 'Team ' + (i + 1);
  });
}

function buildBoard() {
  const b = $('board');
  b.textContent = '';
  DATA.forEach((cat) => {
    const d = document.createElement('div');
    d.className = 'cat';
    d.textContent = cat.name;
    b.appendChild(d);
  });
  VALUES.forEach((v, r) => {
    DATA.forEach((cat, c) => {
      const t = document.createElement('button');
      t.type = 'button';
      t.className = 'tile';
      t.id = 'tile-' + c + '-' + r;
      t.textContent = v;
      t.setAttribute('aria-label', cat.name + ' for ' + v);
      t.addEventListener('click', () => openTile(c, r));
      b.appendChild(t);
    });
  });
}

function buildScores() {
  const s = $('scores');
  const keep = [0, 1].map((i) => ($('tn' + i) ? $('tn' + i).value : 'Team ' + (i + 1)));
  s.textContent = '';
  for (let i = 0; i < TEAMS; i++) {
    const d = document.createElement('div');
    d.className = 'team';
    d.innerHTML =
      '<input type="text" id="tn' + i + '" aria-label="Team ' + (i + 1) + ' name" maxlength="24">' +
      '<div class="row"><span class="score" id="sc' + i + '">0</span>' +
      '<span class="adj"><button type="button" data-t="' + i + '" data-d="-100" aria-label="Minus 100">&minus;100</button>' +
      '<button type="button" data-t="' + i + '" data-d="100" aria-label="Plus 100">+100</button></span></div>';
    s.appendChild(d);
    $('tn' + i).value = keep[i] || 'Team ' + (i + 1);
  }
  s.querySelectorAll('.adj button').forEach((btn) => {
    btn.addEventListener('click', () => {
      st.scores[+btn.dataset.t] += +btn.dataset.d;
      renderScores();
    });
  });
}

function renderScores() {
  for (let i = 0; i < TEAMS; i++) {
    const el = $('sc' + i);
    el.textContent = st.scores[i];
    el.classList.toggle('neg', st.scores[i] < 0);
  }
}

function points() {
  const base = VALUES[st.cur.r];
  return st.dd === st.cur.c + '-' + st.cur.r ? base * 2 : base;
}

function openTile(c, r) {
  if (st.used[c + '-' + r]) return;
  st.cur = { c, r };
  st.tried = [false, false];
  const item = DATA[c].items[r];
  $('mcat').textContent = DATA[c].name;
  $('mpts').textContent = points() + ' points';
  $('mdd').hidden = st.dd !== c + '-' + r;
  $('mq').textContent = item[0];
  $('mat').textContent = item[1];
  $('ma').hidden = true;
  $('show').textContent = 'Show answer';
  stopTimer();
  $('tbar').hidden = true;
  buildAward();
  $('modal').hidden = false;
  $('modal').scrollTop = 0;
  $('show').focus();
}

function buildAward() {
  const a = $('award');
  const n = names();
  a.textContent = '';
  for (let i = 0; i < TEAMS; i++) {
    const g = document.createElement('div');
    g.className = 'grp';
    g.innerHTML =
      '<button type="button" class="btn ok" id="ok' + i + '"></button>' +
      '<button type="button" class="btn no" id="no' + i + '"></button>';
    a.appendChild(g);
    $('ok' + i).textContent = '✓ ' + n[i];
    $('no' + i).textContent = '✗ ' + n[i];
    $('ok' + i).addEventListener('click', () => award(i, true));
    $('no' + i).addEventListener('click', () => award(i, false));
  }
}

function award(team, correct) {
  const p = points();
  if (correct) {
    st.scores[team] += p;
    finish();
    return;
  }
  if ($('penalty').checked) st.scores[team] -= p;
  st.tried[team] = true;
  $('ok' + team).disabled = true;
  $('no' + team).disabled = true;
  renderScores();
  if (st.tried.every(Boolean)) revealAnswer();
}

function revealAnswer() {
  $('ma').hidden = false;
  $('show').textContent = 'Answer shown';
}

function finish() {
  st.used[st.cur.c + '-' + st.cur.r] = true;
  const t = $('tile-' + st.cur.c + '-' + st.cur.r);
  t.classList.add('done');
  t.disabled = true;
  closeModal();
  renderScores();
}

function closeModal() {
  stopTimer();
  $('modal').hidden = true;
}

function stopTimer() {
  if (st.timerId) { clearInterval(st.timerId); st.timerId = null; }
  $('timer').textContent = 'Timer ' + TIME + ' s';
}

function startTimer() {
  if (st.timerId) { stopTimer(); $('tbar').hidden = true; return; }
  const end = Date.now() + TIME * 1000;
  $('tbar').hidden = false;
  $('tfill').style.transform = 'scaleX(1)';
  st.timerId = setInterval(() => {
    const left = Math.max(0, end - Date.now());
    $('tfill').style.transform = 'scaleX(' + (left / (TIME * 1000)) + ')';
    $('timer').textContent = 'Stop (' + Math.ceil(left / 1000) + ' s)';
    if (left <= 0) { clearInterval(st.timerId); st.timerId = null; $('timer').textContent = 'Time is up'; }
  }, 100);
}

$('show').addEventListener('click', revealAnswer);
$('timer').addEventListener('click', startTimer);
$('back').addEventListener('click', closeModal);
$('nobody').addEventListener('click', finish);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('modal').hidden) closeModal();
});

let resetArmed = false;
$('reset').addEventListener('click', () => {
  const btn = $('reset');
  if (!resetArmed) {
    resetArmed = true;
    btn.textContent = 'Click again to confirm';
    setTimeout(() => { resetArmed = false; btn.textContent = 'New game'; }, 3000);
    return;
  }
  resetArmed = false;
  btn.textContent = 'New game';
  st = freshState();
  buildBoard();
  renderScores();
});

st = freshState();
buildBoard();
buildScores();
renderScores();
</script>

</body>
